<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Acme RE · Vendor Rating Dashboard</title>

<!-- ══════════════════════════════════════════════════════════════
     SKIN v2 · "SITE OFFICE" — open-source libraries via CDN
     · Google Fonts: Archivo (UI) + JetBrains Mono (data)
       (embedded Barlow WOFF2 below remains the offline fallback)
     · CountUp.js (github.com/inorganik/countUp.js) — animated KPIs
     All purely presentational: application logic is untouched.
     ══════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>

<!-- suite integration: shared light/dark theme controller (launcher <-> tools) -->
<script src="js/vendor-theme.js"></script>

<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/vendor/chart.umd.js"></script>

<!-- Leaflet: powers the real, pannable/zoomable Vendor Location map. Bundled locally (like
     the SheetJS/Chart.js libs above) so the map engine itself needs no internet connection —
     only the optional OpenStreetMap photo-tile imagery it can layer in is fetched live, and
     22-vendor-location-map.js falls back cleanly (pins/popups/clustering still fully work)
     when that fetch fails, e.g. on a factory floor with no internet. -->
<link rel="stylesheet" href="css/vendor/leaflet.css" />
<script src="js/vendor/leaflet.js"></script>

<link rel="stylesheet" href="css/10-base.css">

<!-- Was two separately-<link>-ed skin files (20-skin-site-office.css, then
     40-skin-chassis.css) that both redefined :root/[data-theme=dark] —
     merged into one file (see its header) so there's a single token source
     instead of two files silently overriding each other by <link> order. -->
<link rel="stylesheet" href="css/20-skin.css">

<link rel="stylesheet" href="css/30-performance.css">


</head>
<body>

<!-- Ambient animated background (decorative, non-interactive). Styling lives
     in the AMBIENT BACKGROUND block of the stylesheet. -->
<div id="bg-fx" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="topbar">
  <div class="logo-b">
    <img class="logo-g" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230072bc'/%3E%3Cpath d='M50 20 L78 78 L64 78 L58 64 L42 64 L36 78 L22 78 Z M50 38 L44 54 L56 54 Z' fill='%23fff'/%3E%3C/svg%3E" alt="ACME RENEWABLES"/>
    <div class="logo-tx">
      <div class="logo-t">ACME RENEWABLES</div>
      <div class="logo-s">Vendor Rating</div>
    </div>
  </div>
  <div class="tsep"></div>
  <div class="tnav-area">
    <div class="nav on" id="nav-overview" tabindex="0" role="button" onclick="go('overview')">
      <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Portfolio
    </div>
    <div class="nav nav-hl" id="nav-scorecard" tabindex="0" role="button" onclick="go('scorecard')">
      <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Vendor Scorecard
    </div>
    <div class="nav nav-hl" id="nav-team" tabindex="0" role="button" onclick="go('team')">
      <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Team Workload
    </div>
    <div class="nav nav-hl" id="nav-vendors" tabindex="0" role="button" onclick="go('vendors')">
      <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Vendor Focus
    </div>
    <div class="nav nav-hl" id="nav-vdetails" tabindex="0" role="button" onclick="go('vdetails')">
      <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M2 4h3M2 9h3M19 4h3M19 9h3"/></svg>
      Vendor Details
    </div>
  </div>
  <div class="tright">
    <div id="topbar-hsel" style="display:inline-flex;align-items:center;border:1px solid var(--brd2);border-radius:6px;overflow:hidden;flex-shrink:0;">
      <button id="tbq-h1" onclick="setActiveQuarter('H1', null, true)" style="padding:5px 11px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fn);background:var(--white);color:var(--t2);border-right:1px solid var(--brd2);transition:background .12s,color .12s;">H1</button>
      <button id="tbq-h2" onclick="setActiveQuarter('H2', null, true)" style="padding:5px 11px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fn);background:var(--white);color:var(--t2);transition:background .12s,color .12s;">H2</button>
    </div>
    <div class="tsep"></div>
    <div class="tdate" id="tdate"></div>
    <button class="theme-toggle" onclick="LTTheme.toggle()" aria-label="Toggle theme" title="Toggle theme">
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn-exp" id="btn-home" onclick="goHome()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span class="btn-exp-full">Upload New Excel</span>
      <span class="btn-exp-short">Upload</span>
    </button>
  </div>
</div>

<div id="navBackdrop" aria-hidden="true"></div>

<!-- Single persistent page <h1>, kept outside #main because setM() replaces
     #main's entire innerHTML on every view switch (see js/app/10-state-and-helpers.js).
     Text is mirrored from each view's own on-page title (.stitle) by setM(),
     so this stays accurate without a separate title map to maintain. Starts
     with the app name so it's meaningful before any tracker is loaded. -->
<h1 id="page-title" class="sr-only">Vendor Rating Dashboard</h1>
<!-- Announces the new page title to screen readers on every view switch,
     since setM() swaps #main's content with no other signal that anything changed. -->
<div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<div id="layout">
  <div id="sidebar" style="display:none"></div>

  <div id="main">
    <div id="upscreen">
      <h2 class="ls-title">Vendor Rating <em>Dashboard</em></h2>

      <div style="display:flex; gap:18px; max-width:820px; width:100%; justify-content:center; flex-wrap:wrap;">

        <div class="upzone" id="dz" style="width:100%; max-width:460px;">
          <input type="file" id="fi" accept=".xlsx,.xls,.csv" multiple/>
          <div class="up-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6"/><path d="M9 14l3-3 3 3"/></svg>
          </div>
          <h2 class="up-title">Load Excel Tracker</h2>
          <div class="up-sub">Drop XLSX or CSV files here, or select from your device.</div>
          <div class="ls-formats"><span>XLSX</span><span>XLS</span><span>CSV</span></div>
          <button class="btn1" onclick="event.stopPropagation();document.getElementById('fi').click()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            Select Files
          </button>
          <div class="ls-hint">Nothing leaves this browser &mdash; files are parsed locally</div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Hidden on screen; populated and shown only when printing a vendor-wise report -->
<div id="print-root"></div>

<div id="debug-modal" onclick="if(event.target.id==='debug-modal')hideDebug()">
  <div class="dbg-panel">
    <button class="dbg-close" onclick="hideDebug()">×</button>
    <div id="dbg-content"></div>
  </div>
</div>


<!-- Application modules: one global scope, load order matters -->
<script src="js/app/10-state-and-helpers.js"></script>
<script src="js/app/20-world-map.js"></script>
<script src="js/app/22-vendor-location-map.js"></script>
<script src="js/app/30-excel-import.js"></script>
<script src="js/app/40-view-overview.js"></script>
<script src="js/app/50-view-team-workload.js"></script>
<script src="js/app/60-vendor-and-project-pages.js"></script>
<script src="js/app/65-view-vendor-details.js"></script>
<script src="js/app/70-rating-matrix-and-scope.js"></script>
<script src="js/app/80-view-scorecard.js"></script>
<script src="js/app/85-view-completeness.js"></script>
<script src="js/app/90-reports-and-modals.js"></script>


<script src="js/ui-enhance.js"></script>


<script src="js/motion.js"></script>

<script src="js/autoload.js"></script>

</body>
</html>
